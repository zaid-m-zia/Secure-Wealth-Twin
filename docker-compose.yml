version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: securewealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securewealth
      POSTGRES_USER: securewealth
      POSTGRES_PASSWORD: securewealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: securewealth-backend
    restart: unless-stopped
    environment:
      APP_NAME: SecureWealth AI
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      DEBUG: "true"
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg2://securewealth:securewealth@postgres:5432/securewealth
      SECRET_KEY: change-me-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securewealth-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
